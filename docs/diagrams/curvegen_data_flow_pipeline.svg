<svg viewBox="0 0 1120 1080" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
  <title>CurveGen module data flow pipeline</title>
  <desc>Shows the core measurement-to-preset pipeline on main, branching into measure, plot, and send commands, plus two unmerged feature-branch extensions: the visualization/loader tool and the Equalizer APO offline exporter.</desc>

  <style>
    .surface { fill: #ffffff; }
    .border-strong { stroke: #333333; }
    .border { stroke: #999999; }
    .text-primary { fill: #1a1a1a; }
    .text-secondary { fill: #555555; }
    .text-accent { fill: #b45309; }
  </style>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrow2d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999999"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="1080" fill="#ffffff"/>

  <text x="560" y="32" text-anchor="middle" font-size="19" font-weight="600" class="text-primary">CurveGen Module — Data Flow Pipeline</text>
  <text x="560" y="52" text-anchor="middle" font-size="12" class="text-secondary">Core pipeline is on main; two extensions live on unmerged feature branches</text>

  <!-- legend -->
  <rect x="900" y="14" width="13" height="13" rx="3" class="surface border-strong" stroke-width="1.5"/>
  <text x="920" y="24" font-size="10" class="text-secondary">on main</text>
  <rect x="900" y="32" width="13" height="13" rx="3" class="surface border" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="920" y="42" font-size="10" class="text-secondary">unmerged branch</text>

  <!-- core spine -->
  <g font-size="13">
    <rect x="390" y="70" width="340" height="58" rx="10" class="surface border-strong" stroke-width="1.5"/>
    <text x="560" y="93" text-anchor="middle" font-weight="600" class="text-primary">WAV measurement file</text>
    <text x="560" y="111" text-anchor="middle" font-size="11" class="text-secondary">recorded room or impulse response</text>
    <line x1="560" y1="128" x2="560" y2="154" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <rect x="390" y="154" width="340" height="58" rx="10" class="surface border-strong" stroke-width="1.5"/>
    <text x="560" y="177" text-anchor="middle" font-weight="600" class="text-primary">measurement.load_wav / load_ir</text>
    <text x="560" y="195" text-anchor="middle" font-size="11" class="text-secondary">Welch PSD or windowed FFT</text>
    <line x1="560" y1="212" x2="560" y2="238" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <rect x="390" y="238" width="340" height="58" rx="10" class="surface border-strong" stroke-width="1.5"/>
    <text x="560" y="261" text-anchor="middle" font-weight="600" class="text-primary">measurement.smooth_octave</text>
    <text x="560" y="279" text-anchor="middle" font-size="11" class="text-secondary">1/3-octave smoothing</text>
    <line x1="560" y1="296" x2="560" y2="322" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <rect x="390" y="322" width="340" height="58" rx="10" class="surface border-strong" stroke-width="1.5"/>
    <text x="560" y="345" text-anchor="middle" font-weight="600" class="text-primary">flatten.compute_correction</text>
    <text x="560" y="363" text-anchor="middle" font-size="11" class="text-secondary">invert, 1kHz reference, clip, preamp</text>
    <line x1="560" y1="380" x2="560" y2="406" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <rect x="390" y="406" width="340" height="58" rx="10" class="surface border-strong" stroke-width="1.5"/>
    <text x="560" y="429" text-anchor="middle" font-weight="600" class="text-primary">export.write_preset</text>
    <text x="560" y="447" text-anchor="middle" font-size="11" class="text-secondary">→ JSON preset file</text>
  </g>

  <!-- fan out to 3 CLI outcomes -->
  <path d="M 560 464 L 560 484 M 560 484 L 210 484 L 210 496 M 560 484 L 560 496 M 560 484 L 910 484 L 910 496" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <path d="M 210 484 L 210 496" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <path d="M 910 484 L 910 496" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <g font-size="12">
    <rect x="45" y="500" width="330" height="58" rx="10" class="surface border-strong" stroke-width="1.5"/>
    <text x="210" y="523" text-anchor="middle" font-weight="600" class="text-primary">eq-curvegen measure</text>
    <text x="210" y="541" text-anchor="middle" font-size="11" class="text-secondary">writes preset only</text>

    <rect x="395" y="500" width="330" height="58" rx="10" class="surface border-strong" stroke-width="1.5"/>
    <text x="560" y="523" text-anchor="middle" font-weight="600" class="text-primary">eq-curvegen plot</text>
    <text x="560" y="541" text-anchor="middle" font-size="11" class="text-secondary">+ matplotlib chart</text>

    <rect x="745" y="500" width="330" height="58" rx="10" class="surface border-strong" stroke-width="1.5"/>
    <text x="910" y="523" text-anchor="middle" font-weight="600" class="text-primary">eq-curvegen send</text>
    <text x="910" y="541" text-anchor="middle" font-size="11" class="text-secondary">→ daemon via IPC socket</text>
  </g>

  <line x1="60" y1="600" x2="1060" y2="600" stroke="#999999" stroke-width="1"/>
  <text x="560" y="622" text-anchor="middle" font-size="12" class="text-secondary">Extensions — feature branches, not yet merged into main:</text>

  <!-- Lane A: measurement-visualization -->
  <rect x="40" y="640" width="500" height="400" rx="12" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="290" y="666" text-anchor="middle" font-size="12" font-weight="600" class="text-accent">branch: measurement-visualization</text>

  <g font-size="12">
    <rect x="80" y="682" width="420" height="58" rx="10" class="surface border" stroke-width="1.5"/>
    <text x="290" y="705" text-anchor="middle" font-weight="600" class="text-primary">loaders.load()</text>
    <text x="290" y="723" text-anchor="middle" font-size="11" class="text-secondary">pluggable registry, wav only today</text>
    <line x1="290" y1="740" x2="290" y2="762" stroke="#999999" stroke-width="1.5" marker-end="url(#arrow2d)"/>

    <rect x="80" y="762" width="420" height="58" rx="10" class="surface border" stroke-width="1.5"/>
    <text x="290" y="785" text-anchor="middle" font-weight="600" class="text-primary">visualize.build_report</text>
    <text x="290" y="803" text-anchor="middle" font-size="11" class="text-secondary">input / curve / expected / output</text>
    <line x1="290" y1="820" x2="290" y2="842" stroke="#999999" stroke-width="1.5" marker-end="url(#arrow2d)"/>

    <rect x="80" y="842" width="420" height="58" rx="10" class="surface border" stroke-width="1.5"/>
    <text x="290" y="861" text-anchor="middle" font-weight="600" class="text-primary">evaluate_eq_response_db</text>
    <text x="290" y="879" text-anchor="middle" font-size="11" class="text-secondary">RBJ biquad math, ported from C++</text>
    <line x1="290" y1="900" x2="290" y2="922" stroke="#999999" stroke-width="1.5" marker-end="url(#arrow2d)"/>

    <rect x="80" y="922" width="420" height="58" rx="10" class="surface border" stroke-width="1.5"/>
    <text x="290" y="945" text-anchor="middle" font-weight="600" class="text-primary">visualize.plot_report</text>
    <text x="290" y="963" text-anchor="middle" font-size="11" class="text-secondary">FFT + CPB panels → PNG report</text>
  </g>

  <!-- Lane B: eqapo-offline-export -->
  <rect x="580" y="640" width="500" height="400" rx="12" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="830" y="666" text-anchor="middle" font-size="12" font-weight="600" class="text-accent">branch: eqapo-offline-export</text>
  <text x="830" y="684" text-anchor="middle" font-size="10" class="text-secondary">(reuses measurement.py + flatten.py above)</text>

  <g font-size="12">
    <rect x="620" y="700" width="420" height="58" rx="10" class="surface border" stroke-width="1.5"/>
    <text x="830" y="723" text-anchor="middle" font-weight="600" class="text-primary">eqapo_export.write_eqapo_config</text>
    <text x="830" y="741" text-anchor="middle" font-size="11" class="text-secondary">same gains → Equalizer APO .txt</text>
    <line x1="830" y1="758" x2="830" y2="780" stroke="#999999" stroke-width="1.5" marker-end="url(#arrow2d)"/>

    <rect x="620" y="780" width="420" height="58" rx="10" class="surface border" stroke-width="1.5"/>
    <text x="830" y="803" text-anchor="middle" font-weight="600" class="text-primary">Equalizer APO (third-party)</text>
    <text x="830" y="821" text-anchor="middle" font-size="11" class="text-secondary">independent engine, real hardware</text>
  </g>
</svg>
