<svg viewBox="0 0 1120 900" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
  <title>DSP module execution pipeline</title>
  <desc>Shows the real-time control and audio path through EqState, IpcServer, and Equalizer10Band, plus three side entry points: the broken Windows APO path, the offline WavEqTest tool, and the unwired OverlapAdd engine.</desc>

  <style>
    .surface { fill: #ffffff; }
    .border-strong { stroke: #333333; }
    .border { stroke: #999999; }
    .text-primary { fill: #1a1a1a; }
    .text-secondary { fill: #555555; }
    .text-accent { fill: #b45309; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="900" fill="#ffffff"/>

  <text x="560" y="32" text-anchor="middle" font-size="19" font-weight="600" class="text-primary">DSP Module — Execution Pipeline</text>
  <text x="560" y="52" text-anchor="middle" font-size="12" class="text-secondary">Three code paths reach the same Biquad / Equalizer10Band core</text>

  <!-- legend -->
  <rect x="900" y="14" width="13" height="13" rx="3" class="surface border-strong" stroke-width="1.5"/>
  <text x="920" y="24" font-size="10" class="text-secondary">verified / active</text>
  <rect x="900" y="32" width="13" height="13" rx="3" class="surface border" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="920" y="42" font-size="10" class="text-secondary">known issue / unwired</text>

  <!-- main spine -->
  <g font-size="13">
    <rect x="390" y="70" width="340" height="58" rx="10" class="surface border-strong" stroke-width="1.5"/>
    <text x="560" y="93" text-anchor="middle" font-weight="600" class="text-primary">eq-curvegen send / GUI</text>
    <text x="560" y="111" text-anchor="middle" font-size="11" class="text-secondary">JSON-line command, Unix socket</text>
    <line x1="560" y1="128" x2="560" y2="154" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="390" y="154" width="340" height="58" rx="10" class="surface border-strong" stroke-width="1.5"/>
    <text x="560" y="177" text-anchor="middle" font-weight="600" class="text-primary">IpcServer::ProcessCommand</text>
    <text x="560" y="195" text-anchor="middle" font-size="11" class="text-secondary">hand-rolled parser, per-client thread</text>
    <line x1="560" y1="212" x2="560" y2="238" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="390" y="238" width="340" height="58" rx="10" class="surface border-strong" stroke-width="1.5"/>
    <text x="560" y="261" text-anchor="middle" font-weight="600" class="text-primary">EqState</text>
    <text x="560" y="279" text-anchor="middle" font-size="11" class="text-secondary">atomic gains / preamp / enabled</text>
    <line x1="560" y1="296" x2="560" y2="322" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="390" y="322" width="340" height="58" rx="10" class="surface border-strong" stroke-width="1.5"/>
    <text x="560" y="345" text-anchor="middle" font-weight="600" class="text-primary">PipeWireBackend::OnProcess</text>
    <text x="560" y="363" text-anchor="middle" font-size="11" class="text-secondary">RT callback, once per audio block</text>
    <line x1="560" y1="380" x2="560" y2="406" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="390" y="406" width="340" height="58" rx="10" class="surface border-strong" stroke-width="1.5"/>
    <text x="560" y="426" text-anchor="middle" font-weight="600" class="text-primary">ConsumePending() → SetBandsPeaking</text>
    <text x="560" y="444" text-anchor="middle" font-size="11" class="text-secondary">10× Biquad::SetPeaking, only if changed</text>
    <line x1="560" y1="464" x2="560" y2="490" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="390" y="490" width="340" height="58" rx="10" class="surface border-strong" stroke-width="1.5"/>
    <text x="560" y="513" text-anchor="middle" font-weight="600" class="text-primary">Interleave L/R × preamp</text>
    <text x="560" y="531" text-anchor="middle" font-size="11" class="text-secondary">gain = 10^(dB/20), applied pre-EQ</text>
    <line x1="560" y1="548" x2="560" y2="574" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="390" y="574" width="340" height="58" rx="10" class="surface border-strong" stroke-width="1.5"/>
    <text x="560" y="597" text-anchor="middle" font-weight="600" class="text-primary">Equalizer10Band::Process</text>
    <text x="560" y="615" text-anchor="middle" font-size="11" class="text-secondary">10 cascaded biquads, dB-additive</text>
    <line x1="560" y1="632" x2="560" y2="658" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="390" y="658" width="340" height="58" rx="10" class="surface border-strong" stroke-width="1.5"/>
    <text x="560" y="681" text-anchor="middle" font-weight="600" class="text-primary">Clamp [-1, 1] + deinterleave</text>
    <text x="560" y="699" text-anchor="middle" font-size="11" class="text-secondary">→ PipeWire output ports</text>
  </g>

  <line x1="120" y1="746" x2="1000" y2="746" stroke="#999999" stroke-width="1"/>
  <text x="560" y="768" text-anchor="middle" font-size="12" class="text-secondary">Same Biquad / Equalizer10Band core, reached three other ways:</text>

  <!-- callout row -->
  <g font-size="12">
    <rect x="45" y="786" width="330" height="76" rx="10" class="surface border" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="210" y="810" text-anchor="middle" font-weight="600" class="text-accent">Windows APO path</text>
    <text x="210" y="828" text-anchor="middle" font-size="11" class="text-secondary">broken: two separate static</text>
    <text x="210" y="843" text-anchor="middle" font-size="11" class="text-secondary">instances (§7.1) — silent passthrough</text>

    <rect x="395" y="786" width="330" height="76" rx="10" class="surface border" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="560" y="810" text-anchor="middle" font-weight="600" class="text-primary">Tools/WavEqTest.cpp</text>
    <text x="560" y="828" text-anchor="middle" font-size="11" class="text-secondary">offline manual test tool</text>
    <text x="560" y="843" text-anchor="middle" font-size="11" class="text-secondary">WAV in → Process → WAV out</text>

    <rect x="745" y="786" width="330" height="76" rx="10" class="surface border" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="910" y="810" text-anchor="middle" font-weight="600" class="text-primary">OverlapAdd (FFT conv.)</text>
    <text x="910" y="828" text-anchor="middle" font-size="11" class="text-secondary">built + tested, not wired into</text>
    <text x="910" y="843" text-anchor="middle" font-size="11" class="text-secondary">any pipeline yet (§2.3)</text>
  </g>
</svg>
